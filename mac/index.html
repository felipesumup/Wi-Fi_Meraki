<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SumUp Wi-Fi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      background: linear-gradient(135deg, #0f1923 0%, #1a2e44 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      max-width: 480px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      padding: 32px 24px;
      text-align: center;
      color: white;
    }

    .header .wifi-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 6px;
    }

    .form-body {
      padding: 32px 28px;
    }

    .form-body p.intro {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input[type="email"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #d0d7de;
      border-radius: 8px;
      font-size: 14px;
      color: #222;
      transition: border-color 0.2s;
      outline: none;
      background: #fafafa;
    }
